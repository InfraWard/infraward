# Configuración de Ansible para la recolección del worker (docs/DESIGN.md §8, §14).
# El worker la usa con ANSIBLE_CONFIG; nunca lee la del usuario ni /etc/ansible.
[defaults]
# La host key se fija con un known_hosts temporal que solo contiene la clave elegida.
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
gathering = explicit
# Sin fact caching ni logs a disco: los facts solo viven en el tmpfs del job.
fact_caching = memory
nocows = True
deprecation_warnings = False
timeout = 30

[ssh_connection]
# Módulos por stdin: no se escriben ficheros temporales en el servidor (solo lectura).
pipelining = True
# Cada conexión reutiliza el ControlMaster que abre el worker en el tmpfs del job (ControlPath y
# certificado llegan en ansible_ssh_common_args): una sola autenticación por job, y en modo CA el
# certificado solo se comprueba ahí. Sin ControlPersist aquí: Ansible añadiría su propio
# ControlPath fuera del tmpfs. El worker cierra el maestro al terminar; ningún ssh sobrevive al
# job ni al borrado de su tmpfs.
ssh_args = -o ControlMaster=auto
